<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Model demo</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
<main>
  <h1>Model demo</h1>
  <div class="workspace">
    <section aria-labelledby="input-heading">
      <h2 id="input-heading">Input</h2>
      <label for="image-file">Choose an image</label>
      <input id="image-file" type="file" accept="image/jpeg,image/png">
      <p class="hint">JPEG or PNG, up to 10 MB.</p>
      <img id="input-preview" alt="Selected input image" hidden>
      <button id="predict" disabled>Run model</button>
      <p id="progress" role="status" aria-live="polite"></p>
    </section>
    <section aria-labelledby="output-heading">
      <h2 id="output-heading">Output</h2>
      <p id="empty">Upload an image and run the model.</p>
      <div id="prediction" hidden>
        <p id="decision" class="decision"></p>
        <dl><div><dt>Melanoma score</dt><dd id="score"></dd></div><div><dt>Threshold</dt><dd id="threshold"></dd></div></dl>
        <figure><img id="overlay" alt="Grad-CAM overlay for the melanoma score" hidden><figcaption id="cam-caption"></figcaption></figure>
      </div>
    </section>
  </div>
  <p class="note">Research demo, not a medical diagnosis. The score is not a calibrated cancer probability.</p>
</main>
</body>
</html>
